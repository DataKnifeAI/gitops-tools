# CloudNativePG Cluster for Authentik - 3 instances for HA
# Requires: authentik-postgres-credentials secret (username, password) in same namespace
# The same password must be AUTHENTIK_POSTGRESQL__PASSWORD in the authentik-env secret.
#
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
  labels:
    component: database
spec:
  instances: 3
  # Omit fsGroup for NFS — kubelet applyFSGroup fails when initdb creates pgdata with 700.
  # With dataset 0777, postgres (UID 26) can access the volume directly.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-postgres-credentials
  storage:
    size: 5Gi
    storageClass: truenas-csi-nfs
  postgresql:
    parameters:
      # Cap WAL kept for lagging/broken replicas so a dead slot cannot fill the 5Gi volume.
      max_slot_wal_keep_size: "1GB"
  # WAL archiving + base backups to rustfs (ObjectStore in objectstore.yaml)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres-rustfs
  # 500m CPU limit throttled the primary in every period during Authentik startup,
  # timing out the server liveness probes.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
