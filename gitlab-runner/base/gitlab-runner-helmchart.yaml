apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: gitlab-runner
  namespace: managed-cicd
spec:
  chart: gitlab-runner
  version: 0.89.0
  repo: https://charts.gitlab.io
  targetNamespace: managed-cicd
  valuesContent: |-
    # GitLab Runner configuration
    # See: https://docs.gitlab.com/runner/install/kubernetes/
    
    # GitLab URL - update with your GitLab instance URL
    gitlabUrl: https://gitlab.com
    # Or for self-hosted: https://gitlab.example.com
    
    # Runner authentication token (glrt-*) is stored in gitlab-runner-secret.
    # Create the runner in GitLab UI, then:
    #   ./scripts/runner-setup.sh gitlab
    #   ./scripts/runner-config.sh
    
    # RBAC configuration
    rbac:
      create: true
    
    # Service account configuration
    serviceAccount:
      create: true
    
    # Runner configuration
    runners:
      # Reference pre-created secret with runner-token (glrt-* authentication token)
      secret: gitlab-runner-secret

      # Kubernetes executor configuration
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "{{.Release.Namespace}}"
            image = "alpine:latest"
            privileged = false
            cpu_limit = "1"
            memory_limit = "2Gi"
            cpu_request = "100m"
            memory_request = "128Mi"
      
      # Runner tags (for group-level runner)
      tags: "kubernetes,managed-cicd,docker"
      
      # Runner executor
      executor: kubernetes
      
      # Builds configuration
      builds:
        # CPU limit for build pods
        cpuLimit: "1"
        # Memory limit for build pods
        memoryLimit: "2Gi"
        # CPU request for build pods
        cpuRequest: "100m"
        # Memory request for build pods
        memoryRequest: "128Mi"
      
      # Service configuration
      service:
        enabled: false
      
      # Cache configuration
      cache:
        # Use Kubernetes volume for cache
        cacheType: "kubernetes"
        cachePath: "/cache"
        cacheShared: true
    
    # Resources for the runner pod
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # Metrics configuration
    metrics:
      enabled: false
    
    # Image configuration — chart default (registry.gitlab.com/gitlab-org/gitlab-runner)
    image:
      registry: registry.gitlab.com
      image: gitlab-org/gitlab-runner
      tag: alpine-v19.0.0
    imagePullPolicy: IfNotPresent
    
    # Check interval for new jobs
    checkInterval: 30
    
    # Concurrent job limit
    # This controls how many jobs can run simultaneously
    # Each job runs in a separate pod, so this effectively controls autoscaling
    # Increase this value to allow more parallel jobs (more pods will be created)
    concurrent: 4
    
    # Runner registration timeout
    registrationTimeout: 180
