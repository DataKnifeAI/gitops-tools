apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: gitlab-runner
  namespace: managed-cicd
spec:
  chart: gitlab-runner
  version: 0.89.0
  repo: https://charts.gitlab.io
  targetNamespace: managed-cicd
  valuesContent: |-
    # GitLab Runner configuration
    # See: https://docs.gitlab.com/runner/install/kubernetes/
    
    # GitLab URL - update with your GitLab instance URL
    gitlabUrl: https://gitlab.com
    # Or for self-hosted: https://gitlab.example.com
    
    # Runner authentication token (glrt-*) is stored in gitlab-runner-secret.
    # ⚠️  DO NOT PUT THE TOKEN HERE - it will be committed to git!
    #
    # To set/update the token:
    #   ./scripts/runner-setup.sh gitlab
    #   ./scripts/runner-config.sh
    
    # RBAC configuration
    rbac:
      create: true
    
    # Service account configuration
    serviceAccount:
      create: true
    
    # Runner pod replicas for high availability
    # With 10 replicas and concurrent: 3, total capacity = 30 concurrent jobs
    replicas: 10
    
    # Runner configuration
    runners:
      # Reference pre-created secret with runner-token (glrt-* authentication token)
      secret: gitlab-runner-secret

      # Kubernetes executor configuration
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "{{.Release.Namespace}}"
            image = "alpine:latest"
            privileged = false
            cpu_limit = "1"
            memory_limit = "2Gi"
            cpu_request = "100m"
            memory_request = "128Mi"
            
            # BuildKit rootless support - disable AppArmor for build containers
            # This allows BuildKit rootless to perform required mount operations
            [runners.kubernetes.pod_annotations]
              "container.apparmor.security.beta.kubernetes.io/build" = "unconfined"
            
            # Harbor (harbor.dataknife.net) uses the public Let's Encrypt chain on ingress.
            # Job pods verify registry TLS with the image default CA bundle — do not mount
            # /etc/docker/certs.d/harbor.dataknife.net (avoids stale or mismatched custom CA).
      
      # Runner tags (for group-level runner)
      tags: "kubernetes,managed-cicd,docker"
      
      # Runner executor
      executor: kubernetes
      
      # Builds configuration
      builds:
        # CPU limit for build pods
        cpuLimit: "1"
        # Memory limit for build pods
        memoryLimit: "2Gi"
        # CPU request for build pods
        cpuRequest: "100m"
        # Memory request for build pods
        memoryRequest: "128Mi"
      
      # Service configuration
      service:
        enabled: false
      
      # Cache configuration
      cache:
        # Use Kubernetes volume for cache
        cacheType: "kubernetes"
        cachePath: "/cache"
        cacheShared: true
    
    # Resources for the runner pod
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # Metrics configuration
    metrics:
      enabled: false
    
    # Image configuration (chart 0.89+ uses registry/image/tag fields)
    image:
      registry: harbor.dataknife.net
      image: dockerhub/gitlab/gitlab-runner
      tag: alpine-v19.0.0
    imagePullPolicy: IfNotPresent
    
    # Check interval for new jobs
    checkInterval: 30
    
    # Concurrent job limit per runner pod
    # This controls how many jobs each runner pod can handle simultaneously
    # Each job runs in a separate pod, so this effectively controls autoscaling
    # With 10 replicas and concurrent: 3, total capacity = 30 concurrent jobs
    # Adjust based on cluster capacity and job resource requirements
    concurrent: 3
    
    # Runner registration timeout
    registrationTimeout: 180
