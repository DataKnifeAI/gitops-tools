# Grafana Helm Chart Configuration - nprd-apps Overlay
#
# Cluster-specific configuration for nprd-apps cluster
#
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: grafana
spec:
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  # grafana/helm-charts is frozen at 10.5.15 (Grafana 12.3.1, chart deprecated);
  # the Grafana version is pinned via image.tag below.
  version: 10.5.15
  targetNamespace: grafana
  valuesContent: |-
    image:
      tag: "12.4.12"
    # Single replica on a ReadWriteOnce SQLite volume: stop the old pod before starting the new one.
    # (Equivalent to Recreate; switching the type would leave the defaulted rollingUpdate block behind.)
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    adminUser: admin
    # adminPassword: Auto-generated by Helm chart (stored in grafana secret)
    persistence:
      enabled: true
      storageClass: truenas-csi-nfs
      size: 10Gi
    initChownData:
      enabled: false  # NFS with root_squash doesn't support chown
    # Chart defaults fsGroup: 472; kubelet applyFSGroup on truenas-csi-nfs fails (permission denied).
    # Explicit fsGroup: null prevents coalescing the default; runAs* matches grafana image user.
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      runAsNonRoot: true
      fsGroup: null
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - grafana.dataknife.net
      path: /
      pathType: Prefix
      # Using default ingress certificate - no explicit TLS secret needed
    # Datasources configuration
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki-query-frontend:3100
            isDefault: true
            jsonData:
              maxLines: 1000
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "fake"
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-kube-prometheus-prometheus:9090
            isDefault: false
            jsonData:
              timeInterval: 30s
              queryTimeout: 300s
              httpMethod: POST
    # Image configuration - using default Grafana images from Docker Hub
