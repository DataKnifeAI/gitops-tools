name: Test Runner

on:
  workflow_dispatch:
  push:
    branches:
    - main
permissions:
  contents: read
  actions: read
jobs:
  test-runner:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Display runner info
      run: 'echo "Runner OS: $(uname -a)"

        echo "Runner hostname: $(hostname)"

        echo "Working directory: $(pwd)"

        echo "Runner labels: ${{ runner.labels }}"

        echo "Runner name: ${{ runner.name }}"

        '
    - name: Test basic commands
      run: 'echo "Testing basic commands..."

        echo "Date: $(date)"

        echo "Uptime: $(uptime)"

        echo "Docker context:"

        docker context ls || echo "docker not available"

        '
    - name: Test environment
      run: 'echo "Environment variables:"

        env | grep -E "RUNNER|GITHUB|CI" | sort

        '
    - name: Success message
      run: 'echo "✅ GitHub runner is working correctly!"

        echo "Runner successfully executed all test steps."

        '
  push-to-gitlab:
    name: Push to GitLab
    uses: DataKnifeAI/github-workflows/.github/workflows/reusable-gitlab-mirror-push.yml@main
    needs:
    - test-runner
    if: >-
      always() && needs.test-runner.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      gitlab_mirror_path: dk-raas/dkai/devops/gitops-tools
