# Promtail Helm Chart Configuration - nprd-apps Overlay
#
# Cluster-specific: Loki in-cluster, RKE2/containerd log path
#
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: promtail
  namespace: grafana
spec:
  chart: promtail
  repo: https://grafana.github.io/helm-charts
  targetNamespace: grafana
  valuesContent: |-
    config:
      clients:
        - url: http://loki-distributor:3100/loki/api/v1/push
      snippets:
        scrapeConfigs: |
          - job_name: kubernetes-pods
            pipeline_stages:
              - cri: {}
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # DaemonSet: only tail pods on this node
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_node_name
                target_label: __host__
              - source_labels:
                  - __meta_kubernetes_pod_controller_name
                regex: ([0-9a-z-.]+?)(-[0-9a-f]+)?$
                action: replace
                target_label: __tmp_controller_name
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                  - __meta_kubernetes_pod_label_app
                  - __meta_kubernetes_pod_label_name
                  - __tmp_controller_name
                regex: ^;*([^;]+)(;.*)?$
                action: replace
                target_label: app
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_instance
                  - __meta_kubernetes_pod_label_release
                regex: ^;*([^;]+)(;.*)?$
                action: replace
                target_label: instance
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_component
                  - __meta_kubernetes_pod_label_component
                regex: ^;*([^;]+)(;.*)?$
                action: replace
                target_label: component
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                target_label: namespace
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_name
                target_label: pod
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_container_name
                target_label: container
              - action: replace
                replacement: $1
                separator: /
                source_labels:
                  - namespace
                  - app
                target_label: job
              # RKE2/containerd: /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                  - __meta_kubernetes_pod_name
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                separator: ;
                regex: (.+);(.+);(.+);(.+)
                replacement: /var/log/pods/$1_$2_$3/$4/*.log
                target_label: __path__
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                  - __meta_kubernetes_pod_label_app
                  - __meta_kubernetes_pod_label_app_kubernetes_io_component
                  - __meta_kubernetes_pod_label_component
                  - __tmp_controller_name
                regex: ^;*([^;]+)(;.*)?$
                target_label: app
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_instance
                  - __meta_kubernetes_pod_label_release
                regex: ^;*([^;]+)(;.*)?$
                target_label: instance
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_component
                  - __meta_kubernetes_pod_label_component
                regex: ^;*([^;]+)(;.*)?$
                target_label: component
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                target_label: namespace
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_name
                target_label: pod
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_container_name
                target_label: container
              - action: replace
                replacement: $1
                separator: /
                source_labels:
                  - namespace
                  - app
                target_label: job
              # RKE2/containerd: __path__ (second block, same pattern)
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                  - __meta_kubernetes_pod_name
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                separator: ;
                regex: (.+);(.+);(.+);(.+)
                replacement: /var/log/pods/$1_$2_$3/$4/*.log
                target_label: __path__
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    image:
      registry: harbor.dataknife.net
      repository: dockerhub/grafana/promtail
      tag: "3.6.2"
