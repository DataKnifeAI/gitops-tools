# Grafana Alloy Helm Chart Configuration - rancher-manager Overlay
#
# Replaces Promtail + prometheus-node-exporter with unified Alloy DaemonSet.
# - Logs -> remote Loki (nprd-apps via ingress)
# - Metrics -> in-cluster Prometheus (remote_write)
#
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: alloy
  namespace: grafana
spec:
  chart: alloy
  repo: https://grafana.github.io/helm-charts
  targetNamespace: grafana
  valuesContent: |-
    controller:
      type: daemonset
      volumes:
        extra:
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: sys
            hostPath:
              path: /sys
              type: Directory
    alloy:
      mounts:
        varlog: false
        dockercontainers: false
        extra:
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: sys
            mountPath: /host/sys
            readOnly: true
      configMap:
        create: true
        content: |
          loki.write "default" {
            endpoint {
              url = "https://loki.dataknife.net/loki/api/v1/push"
            }
          }
          prometheus.remote_write "prometheus" {
            endpoint {
              url = "http://prometheus-kube-prometheus-prometheus:9090/api/v1/write"
            }
          }
          discovery.kubernetes "pod" {
            role = "pod"
            selectors {
              role = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pod.targets
            rule { source_labels = ["__meta_kubernetes_namespace"]; target_label = "namespace"; action = "replace" }
            rule { source_labels = ["__meta_kubernetes_pod_name"]; target_label = "pod"; action = "replace" }
            rule { source_labels = ["__meta_kubernetes_pod_container_name"]; target_label = "container"; action = "replace" }
            rule { source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_name"]; regex = "^;*([^;]+)(;.*)?$"; target_label = "app"; action = "replace" }
            rule { source_labels = ["namespace", "app"]; separator = "/"; regex = "(.+)"; target_label = "job"; replacement = "$1"; action = "replace" }
          }
          loki.source.kubernetes "pod_logs" {
            targets = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }
          prometheus.exporter.unix "localhost" {
            procfs_path = "/host/proc"
            sysfs_path = "/host/sys"
            include_exporter_metrics = true
          }
          prometheus.scrape "unix" {
            targets = prometheus.exporter.unix.localhost.targets
            forward_to = [prometheus.remote_write.prometheus.receiver]
          }
      resources:
        requests:
          cpu: 300m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    image:
      registry: docker.io
      repository: grafana/alloy
      tag: "1.6.2"
